name: Apply bounded CLA governance patch

on:
  push:
    branches:
      - chore/hosted-cla-assistant
    paths:
      - .github/workflows/patch-cla-governance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/hosted-cla-assistant
          fetch-depth: 0

      - name: Align contributor paths and canonical hash
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json

          contributing = Path("CONTRIBUTING.md")
          text = contributing.read_text(encoding="utf-8")
          old = """- All intentionally submitted contributions require the repository [Individual CLA](./CLA.md).
          - Open a pull request and follow the link posted by the hosted CLA Assistant GitHub App. The `license/cla` check must pass before merge.
          - The hosted form is for individual contributors. If an employer or another entity owns or controls the relevant rights, do not sign on its behalf through that form; contact the maintainers privately about the corporate agreement and authorization process.
          - See the [Contributor Licensing Records Privacy Notice](./docs/governance/cla-privacy.md) for the licensing-record fields, purpose, retention, and access/correction process."""
          new = """- Every intentionally submitted contribution must be covered by the applicable contributor agreement.
          - Individual contributors sign the repository [Individual CLA](./CLA.md) through the hosted CLA Assistant GitHub App. Open a pull request, follow the App's signing link, and wait for `license/cla` to pass.
          - If an employer or another entity owns or controls the relevant rights, do not use the individual form. Contact the maintainers privately before submitting the covered contribution so the corporate agreement and authorization process can be completed.
          - See the [Contributor Licensing Records Privacy Notice](./docs/governance/cla-privacy.md) for the licensing-record fields, purpose, retention, and access/correction process."""
          if text.count(old) != 1:
              raise SystemExit("expected exactly one CONTRIBUTING agreement block")
          contributing.write_text(text.replace(old, new), encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = """External contributions require signing the repository [CLA](./CLA.md). `xbrlkit`'s public alpha contribution policy is `AGPL-3.0-or-later` plus CLA, and accepted contributions remain under the same license."""
          new = """Every external contribution must be covered by the applicable contributor agreement. Individual contributors sign the repository [Individual CLA](./CLA.md) through the hosted CLA Assistant flow. If an employer or another entity owns or controls the relevant rights, contact the maintainers privately before submitting the covered contribution so the corporate agreement and authorization process can be completed.

          `xbrlkit`'s public alpha contribution policy is `AGPL-3.0-or-later` plus the applicable contributor agreement, and accepted contributions remain under `AGPL-3.0-or-later`."""
          if text.count(old) != 1:
              raise SystemExit("expected exactly one README agreement paragraph")
          readme.write_text(text.replace(old, new), encoding="utf-8")

          source_path = Path("docs/governance/cla-assistant-source.json")
          source = json.loads(source_path.read_text(encoding="utf-8"))
          source["agreement"]["sha256"] = sha256(Path("CLA.md").read_bytes()).hexdigest()
          source["metadata"]["sha256"] = sha256(Path("docs/governance/cla-assistant-metadata.json").read_bytes()).hexdigest()
          source_path.write_text(json.dumps(source, indent=2) + "\n", encoding="utf-8")

          Path(".github/workflows/patch-cla-governance.yml").unlink()
          print(f"CLA_SHA256={source['agreement']['sha256']}")
          print(f"METADATA_SHA256={source['metadata']['sha256']}")
          PY

      - name: Commit the bounded patch and remove this workflow
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add CONTRIBUTING.md README.md docs/governance/cla-assistant-source.json .github/workflows/patch-cla-governance.yml
          git commit -m "docs(cla): align agreement paths and hashes"
          git push origin HEAD:chore/hosted-cla-assistant
